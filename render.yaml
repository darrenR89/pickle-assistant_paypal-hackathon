# Render Blueprint. Key Value and the cron job get added as the build plan reaches them.
databases:
  - name: pickle-assistant-db
    plan: free # free Postgres expires after 30 days; upgrade to basic-256mb before judging
services:
  - type: web
    name: pickle-assistant
    runtime: node
    plan: free # move to starter before judging so the app doesn't sleep
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      # "on" saves the player's PayPal for games more than 3 days away and holds 2 days before.
      - key: DELAYED_HOLDS
        value: "off"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BLOOIO_API_KEY
        sync: false
      - key: BLOOIO_WEBHOOK_SECRET
        sync: false
      - key: BLOOIO_FROM_NUMBER
        sync: false
      - key: SENDBLUE_API_KEY
        sync: false
      - key: SENDBLUE_API_SECRET
        sync: false
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      - key: APP_URL
        value: https://pickle-assistant.onrender.com
      - key: DEMO_BUYER_EMAIL
        sync: false
      - key: DEMO_BUYER_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_DEMO_VIDEO_ID
        sync: false
      - key: NEXT_PUBLIC_DEMO_VERTICAL_SRC
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pickle-assistant-db
          property: connectionString
